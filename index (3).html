<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ssun library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#211D19;
    --ink-soft:#5B554D;
    --line:#D9D2C4;
    --amber:#B4802B;
    --teal:#2B4A43;
    --row-hover:#EFEADC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:56px 32px 28px;
    max-width:960px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 42px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
    max-width:56ch;
    line-height:1.6;
  }

  .breadcrumb{
    max-width:960px;
    margin:0 auto;
    padding:20px 32px 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .breadcrumb button{
    background:none;
    border:none;
    padding:0;
    font:inherit;
    color:var(--teal);
    cursor:pointer;
    text-decoration:underline;
  }
  .breadcrumb .sep{
    margin:0 6px;
    color:var(--line);
  }
  .breadcrumb .current{
    color:var(--ink);
  }

  .folder-list{
    list-style:none;
    margin:0 auto;
    padding:20px 32px 60px;
    max-width:960px;
  }
  .folder-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    background:none;
    border-left:none;
    border-right:none;
    border-top:none;
    width:100%;
    text-align:left;
    font-family:inherit;
    color:var(--ink);
  }
  .folder-row:hover{background:var(--row-hover);}
  .folder-icon{
    width:38px;
    height:38px;
    flex-shrink:0;
    color:var(--amber);
  }
  .folder-name{
    flex:1;
    font-size:16px;
    font-weight:500;
  }
  .folder-count{
    font-size:13px;
    color:var(--ink-soft);
  }
  .folder-arrow{
    color:var(--ink-soft);
    font-size:18px;
  }

  .controls{
    max-width:960px;
    margin:0 auto;
    padding:20px 32px 0;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
  }
  .controls input[type="text"]{
    flex:1 1 220px;
    padding:10px 14px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
  }
  .controls select{
    padding:10px 12px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
  }

  .count-row{
    max-width:960px;
    margin:18px auto 0;
    padding:0 32px;
    font-size:13px;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }

  ul.track-list{
    list-style:none;
    margin:0 auto;
    padding:0 32px 60px;
    max-width:960px;
  }
  .track{
    display:grid;
    grid-template-columns:48px 1fr auto auto;
    align-items:center;
    gap:16px;
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .track:hover{background:var(--row-hover);}
  .cover{
    width:48px;
    height:48px;
    border-radius:3px;
    background:var(--teal);
    background-size:cover;
    background-position:center;
    flex-shrink:0;
  }
  .meta .title{
    font-weight:500;
    font-size:15px;
    margin:0 0 2px;
  }
  .meta .sub{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  audio{
    height:32px;
    width:220px;
    max-width:38vw;
  }
  .dl-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border:1px solid var(--ink);
    border-radius:3px;
    text-decoration:none;
    color:var(--ink);
    font-size:13px;
    white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .dl-btn:hover{
    background:var(--ink);
    color:var(--paper);
  }

  .empty-state{
    max-width:960px;
    margin:60px auto;
    padding:0 32px;
    color:var(--ink-soft);
    font-size:14px;
  }

  .docs-section{
    max-width:960px;
    margin:0 auto;
    padding:20px 32px 60px;
  }
  ul.docs-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .doc-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }

  [hidden]{display:none !important;}

  @media (max-width:640px){
    .track{grid-template-columns:40px 1fr; row-gap:10px;}
    audio{grid-column:1 / -1; width:100%; max-width:none;}
    .dl-btn{grid-column:1 / -1; justify-self:start;}
    .doc-item{flex-direction:column; align-items:flex-start; gap:8px;}
  }
</style>
</head>
<body>

<header>
  <img id="siteLogo" alt="" style="display:none; height:40px; width:40px; object-fit:cover; border-radius:4px; margin-bottom:12px;" />
  <h1>ssun library</h1>
  <p>폴더를 눌러 들어가면 식순별 곡과 문서 자료를 확인할 수 있습니다.</p>
</header>

<nav class="breadcrumb" id="breadcrumb"></nav>

<!-- 1단계: 홈 (음원 / 문서자료 폴더) -->
<ul class="folder-list" id="homeView" hidden>
  <li>
    <button class="folder-row" id="goMusicFolder">
      <svg class="folder-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
      <span class="folder-name">음원</span>
      <span class="folder-count" id="musicFolderCount"></span>
      <span class="folder-arrow">›</span>
    </button>
  </li>
  <li>
    <button class="folder-row" id="goDocsFolder">
      <svg class="folder-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
      <span class="folder-name">문서 자료</span>
      <span class="folder-count" id="docsFolderCount"></span>
      <span class="folder-arrow">›</span>
    </button>
  </li>
</ul>

<!-- 2단계: 음원 카테고리 폴더 목록 -->
<ul class="folder-list" id="categoriesView" hidden></ul>

<!-- 3단계: 특정 카테고리의 곡 목록 -->
<div class="controls" id="controlsBar" hidden>
  <input type="text" id="searchInput" placeholder="곡 제목 검색" />
  <select id="sortSelect">
    <option value="recent">최신순</option>
    <option value="title">제목순</option>
  </select>
</div>
<div class="count-row" id="countRow" hidden></div>
<ul class="track-list" id="trackList" hidden></ul>

<!-- 문서 자료 목록 -->
<div class="docs-section" id="docsSection" hidden>
  <ul class="docs-list" id="docsList"></ul>
</div>

<script>
/* ============================================================
   이 페이지는 index.html을 수정할 필요가 없습니다.

   [음원] audio 폴더에 아래 규칙대로 파일명을 지어서 mp3만
   올리면 자동으로 목록에 나타납니다.

   파일명 규칙:
     [식순] 제목_타이밍.mp3
   예) [신랑입장] 봄날의 왈츠_2분30초.mp3

   식순(카테고리)은 아래 5개를 기준으로 화면에 정렬됩니다.
   이 5개 밖의 이름으로 올리면 목록 맨 뒤에 추가로 나타납니다.
     혼주입장&화촉점화 / 신랑입장 / 신부입장 /
     성혼선언문&혼인서약서&양가혼주님인사 / 행진

   커버 이미지(선택): covers 폴더에 audio 파일과 같은 이름으로
   jpg 또는 png를 넣으면 자동으로 매칭됩니다.
   "로고.png" 라는 이름으로 넣으면 사이트 로고 + 커버 없는
   곡들의 기본 이미지로 쓰입니다.

   [문서] docs 폴더에 파일을 올리면 이름 그대로 목록에 자동으로
   나타납니다. (placeholder.txt는 자동으로 제외됩니다)

   OWNER / REPO 값은 이 저장소의 GitHub 주소
   (github.com/OWNER/REPO) 그대로 넣어주세요.
   ============================================================ */
const OWNER = "ssssunn";
const REPO = "music-site";

const CATEGORY_ORDER = [
  "혼주입장&화촉점화",
  "신랑입장",
  "신부입장",
  "성혼선언문&혼인서약서&양가혼주님인사",
  "행진"
];

let TRACKS = [];
let DOCS = [];

let state = {
  search: "",
  sort: "recent",
  category: null   // 현재 열어본 카테고리 (3단계에서만 사용)
};

const breadcrumbEl = document.getElementById("breadcrumb");
const homeViewEl = document.getElementById("homeView");
const categoriesViewEl = document.getElementById("categoriesView");
const controlsBarEl = document.getElementById("controlsBar");
const countEl = document.getElementById("countRow");
const listEl = document.getElementById("trackList");
const docsSectionEl = document.getElementById("docsSection");
const docsListEl = document.getElementById("docsList");
const musicFolderCountEl = document.getElementById("musicFolderCount");
const docsFolderCountEl = document.getElementById("docsFolderCount");

// ---- GitHub 저장소의 폴더 목록을 읽어오는 함수 ----
async function fetchFolder(path) {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`);
  if (!res.ok) return [];
  const data = await res.json();
  if (!Array.isArray(data)) return [];
  return data.filter(f => f.type === "file");
}

// ---- 파일명 파싱: [식순] 제목_타이밍.mp3 ----
function parseFilename(filename) {
  const nameOnly = filename.replace(/\.mp3$/i, "");
  const match = nameOnly.match(/^\[(.+?)\]\s*(.+)$/);
  if (!match) return null;
  const category = match[1].trim();
  const rest = match[2].trim();
  const lastUnderscore = rest.lastIndexOf("_");
  let title, timing;
  if (lastUnderscore === -1) {
    title = rest;
    timing = "";
  } else {
    title = rest.slice(0, lastUnderscore).trim();
    timing = rest.slice(lastUnderscore + 1).trim();
  }
  return { title, category, timing };
}

// ---- 전체 데이터 로딩 ----
async function loadAll() {
  let audioFiles = [], coverFiles = [], docFiles = [];
  try {
    [audioFiles, coverFiles, docFiles] = await Promise.all([
      fetchFolder("audio"),
      fetchFolder("covers"),
      fetchFolder("docs")
    ]);
  } catch (err) {
    homeViewEl.hidden = false;
    homeViewEl.innerHTML = `<li class="empty-state">목록을 불러오지 못했습니다. 잠시 후 새로고침해보세요.</li>`;
    return;
  }

  const coverMap = {};
  coverFiles.forEach(f => {
    const base = f.name.replace(/\.(jpg|jpeg|png)$/i, "").normalize("NFC").trim();
    coverMap[base] = f.download_url;
  });

  const defaultCover = coverMap["로고"] || coverMap["logo"] || "";
  const siteLogoEl = document.getElementById("siteLogo");
  if (defaultCover) {
    siteLogoEl.src = defaultCover;
    siteLogoEl.style.display = "inline-block";
  }

  TRACKS = audioFiles
    .filter(f => /\.mp3$/i.test(f.name))
    .map((f, idx) => {
      const parsed = parseFilename(f.name);
      if (!parsed) return null;
      const base = f.name.replace(/\.mp3$/i, "").normalize("NFC").trim();
      return {
        id: idx + 1,
        title: parsed.title,
        category: parsed.category,
        timing: parsed.timing,
        cover: coverMap[base] || defaultCover,
        audio: f.download_url
      };
    })
    .filter(Boolean);

  DOCS = docFiles.filter(f => f.name.toLowerCase() !== "placeholder.txt");

  musicFolderCountEl.textContent = `${TRACKS.length}곡`;
  docsFolderCountEl.textContent = `${DOCS.length}개`;

  showHome();
}

// ---- 카테고리 목록 구하기 (정해진 순서 우선, 나머지는 뒤에) ----
function getOrderedCategories() {
  const present = [...new Set(TRACKS.map(t => t.category))];
  const ordered = CATEGORY_ORDER.filter(c => present.includes(c));
  const extra = present.filter(c => !CATEGORY_ORDER.includes(c));
  return [...ordered, ...extra];
}

// ---- 화면 전환 함수들 ----
function hideAllViews() {
  homeViewEl.hidden = true;
  categoriesViewEl.hidden = true;
  controlsBarEl.hidden = true;
  countEl.hidden = true;
  listEl.hidden = true;
  docsSectionEl.hidden = true;
}

function renderBreadcrumb(trail) {
  // trail: [{label, onClick}], 마지막 항목은 현재 위치(클릭 불가)
  breadcrumbEl.innerHTML = trail.map((item, idx) => {
    const isLast = idx === trail.length - 1;
    const sep = idx > 0 ? `<span class="sep">/</span>` : "";
    if (isLast) {
      return `${sep}<span class="current">${item.label}</span>`;
    }
    return `${sep}<button data-idx="${idx}">${item.label}</button>`;
  }).join("");
  [...breadcrumbEl.querySelectorAll("button")].forEach(btn => {
    const idx = Number(btn.dataset.idx);
    btn.addEventListener("click", trail[idx].onClick);
  });
}

function showHome() {
  hideAllViews();
  homeViewEl.hidden = false;
  renderBreadcrumb([{ label: "ssun library", onClick: showHome }]);
}

function showCategories() {
  hideAllViews();
  categoriesViewEl.hidden = false;
  renderBreadcrumb([
    { label: "ssun library", onClick: showHome },
    { label: "음원", onClick: showCategories }
  ]);

  const categories = getOrderedCategories();
  if (categories.length === 0) {
    categoriesViewEl.innerHTML = `<li class="empty-state">아직 등록된 곡이 없습니다.</li>`;
    return;
  }
  categoriesViewEl.innerHTML = categories.map(cat => {
    const count = TRACKS.filter(t => t.category === cat).length;
    return `
      <li>
        <button class="folder-row" data-category="${cat}">
          <svg class="folder-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="folder-name">${cat}</span>
          <span class="folder-count">${count}곡</span>
          <span class="folder-arrow">›</span>
        </button>
      </li>
    `;
  }).join("");
  [...categoriesViewEl.querySelectorAll(".folder-row")].forEach(btn => {
    btn.addEventListener("click", () => showCategoryTracks(btn.dataset.category));
  });
}

function showCategoryTracks(category) {
  hideAllViews();
  controlsBarEl.hidden = false;
  countEl.hidden = false;
  listEl.hidden = false;
  state.category = category;
  state.search = "";
  document.getElementById("searchInput").value = "";
  renderBreadcrumb([
    { label: "ssun library", onClick: showHome },
    { label: "음원", onClick: showCategories },
    { label: category, onClick: () => showCategoryTracks(category) }
  ]);
  renderTrackList();
}

function showDocs() {
  hideAllViews();
  docsSectionEl.hidden = false;
  renderBreadcrumb([
    { label: "ssun library", onClick: showHome },
    { label: "문서 자료", onClick: showDocs }
  ]);
  renderDocs();
}

document.getElementById("goMusicFolder").addEventListener("click", showCategories);
document.getElementById("goDocsFolder").addEventListener("click", showDocs);

// ---- 이벤트 연결 ----
document.getElementById("searchInput").addEventListener("input", e => {
  state.search = e.target.value.trim().toLowerCase();
  renderTrackList();
});
document.getElementById("sortSelect").addEventListener("change", e => {
  state.sort = e.target.value;
  renderTrackList();
});

// ---- 곡 목록 렌더 (선택된 카테고리 안에서만) ----
function renderTrackList() {
  let list = TRACKS.filter(t => t.category === state.category);

  if (state.search) {
    list = list.filter(t => t.title.toLowerCase().includes(state.search));
  }

  if (state.sort === "title") {
    list.sort((a, b) => a.title.localeCompare(b.title, "ko"));
  } else {
    list.sort((a, b) => b.id - a.id);
  }

  countEl.textContent = `${list.length}곡`;

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty-state">조건에 맞는 곡이 없습니다.</div>`;
    return;
  }

  listEl.innerHTML = list.map(t => `
    <li class="track">
      <div class="cover" style="${t.cover ? `background-image:url('${t.cover}')` : ""}"></div>
      <div class="meta">
        <p class="title">${t.title}</p>
        <p class="sub">${t.timing ? `<span>${t.timing}</span>` : ""}</p>
      </div>
      <audio controls preload="none" src="${t.audio}"></audio>
      <a class="dl-btn" href="${t.audio}" download>다운로드</a>
    </li>
  `).join("");
}

// ---- 문서 자료 렌더 ----
function renderDocs() {
  if (DOCS.length === 0) {
    docsListEl.innerHTML = `<li class="doc-item" style="color:var(--ink-soft);">등록된 문서가 없습니다.</li>`;
    return;
  }
  docsListEl.innerHTML = DOCS.map(f => `
    <li class="doc-item">
      <span>${f.name}</span>
      <a class="dl-btn" href="${f.download_url}" download>다운로드</a>
    </li>
  `).join("");
}

loadAll();
</script>
</body>
</html>
