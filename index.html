<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ssun library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#211D19;
    --ink-soft:#5B554D;
    --line:#D9D2C4;
    --amber:#B4802B;
    --teal:#2B4A43;
    --row-hover:#EFEADC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:56px 32px 28px;
    max-width:960px;
    margin:0 auto;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 42px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
    max-width:56ch;
    line-height:1.6;
  }

  .controls{
    max-width:960px;
    margin:0 auto;
    padding:24px 32px 0;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
  }
  .controls input[type="text"]{
    flex:1 1 220px;
    padding:10px 14px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
  }
  .controls select{
    padding:10px 12px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
  }

  .count-row{
    max-width:960px;
    margin:26px auto 0;
    padding:0 32px;
    font-size:13px;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }

  ul.track-list{
    list-style:none;
    margin:0 auto;
    padding:0 32px 40px;
    max-width:960px;
  }
  .track{
    display:grid;
    grid-template-columns:48px 1fr auto auto;
    align-items:center;
    gap:16px;
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .track:hover{background:var(--row-hover);}
  .cover{
    width:48px;
    height:48px;
    border-radius:3px;
    background:var(--teal);
    background-size:cover;
    background-position:center;
    flex-shrink:0;
  }
  .meta .title{
    font-weight:500;
    font-size:15px;
    margin:0 0 2px;
  }
  .meta .sub{
    font-size:13px;
    color:var(--ink-soft);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .meta .sub .tag{
    color:var(--amber);
  }
  audio{
    height:32px;
    width:220px;
    max-width:38vw;
  }
  .dl-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border:1px solid var(--ink);
    border-radius:3px;
    text-decoration:none;
    color:var(--ink);
    font-size:13px;
    white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .dl-btn:hover{
    background:var(--ink);
    color:var(--paper);
  }

  .empty-state{
    max-width:960px;
    margin:60px auto;
    padding:0 32px;
    color:var(--ink-soft);
    font-size:14px;
  }

  .docs-section{
    max-width:960px;
    margin:0 auto;
    padding:0 32px 80px;
  }
  .docs-heading{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 4px;
    padding-top:32px;
  }
  ul.docs-list{
    list-style:none;
    margin:12px 0 0;
    padding:0;
  }
  .doc-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }

  @media (max-width:640px){
    .track{grid-template-columns:40px 1fr; row-gap:10px;}
    audio{grid-column:1 / -1; width:100%; max-width:none;}
    .dl-btn{grid-column:1 / -1; justify-self:start;}
    .doc-item{flex-direction:column; align-items:flex-start; gap:8px;}
  }
</style>
</head>
<body>

<header>
  <h1>ssun library</h1>
  <p>식순과 곡 제목으로 찾아 미리 듣고, 필요한 곡과 자료는 바로 다운로드할 수 있습니다.</p>
</header>

<div class="controls">
  <input type="text" id="searchInput" placeholder="곡 제목 또는 식순 검색" />
  <select id="categorySelect">
    <option value="all">전체 식순</option>
  </select>
  <select id="sortSelect">
    <option value="recent">최신순</option>
    <option value="title">제목순</option>
    <option value="category">식순순</option>
  </select>
</div>

<div class="count-row" id="countRow"></div>

<ul class="track-list" id="trackList"></ul>

<div class="docs-section" id="docsSection">
  <h2 class="docs-heading">문서 자료</h2>
  <ul class="docs-list" id="docsList"></ul>
</div>

<script>
/* ============================================================
   이 페이지는 index.html을 수정할 필요가 없습니다.

   [음원] audio 폴더에 아래 규칙대로 파일명을 지어서 mp3만
   올리면 자동으로 목록에 나타납니다.

   파일명 규칙:
     [식순] 제목_타이밍.mp3
   예) [신랑입장] 봄날의 왈츠_2분30초.mp3

   커버 이미지(선택): covers 폴더에 audio 파일과 같은 이름으로
   jpg 또는 png를 넣으면 자동으로 매칭됩니다.

   [문서] docs 폴더에 파일을 올리면 이름 그대로 목록에 자동으로
   나타납니다. (placeholder.txt는 자동으로 목록에서 제외됩니다)

   OWNER / REPO 값은 이 저장소의 GitHub 주소
   (github.com/OWNER/REPO) 그대로 넣어주세요.
   ============================================================ */
const OWNER = "ssssunn";
const REPO = "music-site";

let TRACKS = [];

// ---- 상태 ----
let state = {
  search: "",
  category: "all",
  sort: "recent"
};

const categorySelect = document.getElementById("categorySelect");
const listEl = document.getElementById("trackList");
const countEl = document.getElementById("countRow");
const docsListEl = document.getElementById("docsList");

// ---- GitHub 저장소의 폴더 목록을 읽어오는 함수 ----
async function fetchFolder(path) {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`);
  if (!res.ok) return [];
  const data = await res.json();
  if (!Array.isArray(data)) return [];
  return data.filter(f => f.type === "file");
}

// ---- 파일명 파싱: [식순] 제목_타이밍.mp3 ----
function parseFilename(filename) {
  const nameOnly = filename.replace(/\.mp3$/i, "");
  const match = nameOnly.match(/^\[(.+?)\]\s*(.+)$/);
  if (!match) return null;
  const category = match[1].trim();
  const rest = match[2].trim();
  const lastUnderscore = rest.lastIndexOf("_");
  let title, timing;
  if (lastUnderscore === -1) {
    title = rest;
    timing = "";
  } else {
    title = rest.slice(0, lastUnderscore).trim();
    timing = rest.slice(lastUnderscore + 1).trim();
  }
  return { title, category, timing };
}

// ---- 초기 로딩: audio, covers, docs 폴더를 읽어서 구성 ----
async function loadTracks() {
  listEl.innerHTML = "";
  countEl.textContent = "곡 목록을 불러오는 중...";

  let audioFiles = [];
  let coverFiles = [];
  let docFiles = [];
  try {
    [audioFiles, coverFiles, docFiles] = await Promise.all([
      fetchFolder("audio"),
      fetchFolder("covers"),
      fetchFolder("docs")
    ]);
  } catch (err) {
    countEl.textContent = "";
    listEl.innerHTML = `<div class="empty-state">목록을 불러오지 못했습니다. 잠시 후 새로고침해보세요.</div>`;
    return;
  }

  const coverMap = {};
  coverFiles.forEach(f => {
    const base = f.name.replace(/\.(jpg|jpeg|png)$/i, "");
    coverMap[base] = f.download_url;
  });

  TRACKS = audioFiles
    .filter(f => /\.mp3$/i.test(f.name))
    .map((f, idx) => {
      const parsed = parseFilename(f.name);
      if (!parsed) return null;
      const base = f.name.replace(/\.mp3$/i, "");
      return {
        id: idx + 1,
        title: parsed.title,
        category: parsed.category,
        timing: parsed.timing,
        cover: coverMap[base] || "",
        audio: f.download_url
      };
    })
    .filter(Boolean);

  buildCategoryOptions();
  render();
  renderDocs(docFiles);
}

function buildCategoryOptions() {
  categorySelect.innerHTML = `<option value="all">전체 식순</option>`;
  const categories = [...new Set(TRACKS.map(t => t.category))];
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = cat;
    categorySelect.appendChild(opt);
  });
}

// ---- 이벤트 연결 ----
document.getElementById("searchInput").addEventListener("input", e => {
  state.search = e.target.value.trim().toLowerCase();
  render();
});
categorySelect.addEventListener("change", e => {
  state.category = e.target.value;
  render();
});
document.getElementById("sortSelect").addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});

// ---- 필터 + 정렬 + 렌더 (음원 목록) ----
function render() {
  let list = TRACKS.filter(t => {
    const matchesSearch =
      !state.search ||
      t.title.toLowerCase().includes(state.search) ||
      t.category.toLowerCase().includes(state.search);
    const matchesCategory = state.category === "all" || t.category === state.category;
    return matchesSearch && matchesCategory;
  });

  if (state.sort === "title") {
    list.sort((a, b) => a.title.localeCompare(b.title, "ko"));
  } else if (state.sort === "category") {
    list.sort((a, b) => a.category.localeCompare(b.category, "ko"));
  } else {
    list.sort((a, b) => b.id - a.id); // 최신순 = id 큰 순
  }

  countEl.textContent = `${list.length}곡`;

  if (list.length === 0) {
    listEl.innerHTML = "";
    listEl.insertAdjacentHTML(
      "afterend",
      `<div class="empty-state" id="emptyState">조건에 맞는 곡이 없습니다. 검색어나 필터를 바꿔보세요.</div>`
    );
    return;
  }
  const existingEmpty = document.getElementById("emptyState");
  if (existingEmpty) existingEmpty.remove();

  listEl.innerHTML = list.map(t => `
    <li class="track">
      <div class="cover" style="${t.cover ? `background-image:url('${t.cover}')` : ""}"></div>
      <div class="meta">
        <p class="title">${t.title}</p>
        <p class="sub">
          <span class="tag">${t.category}</span>
          ${t.timing ? `<span>${t.timing}</span>` : ""}
        </p>
      </div>
      <audio controls preload="none" src="${t.audio}"></audio>
      <a class="dl-btn" href="${t.audio}" download>다운로드</a>
    </li>
  `).join("");
}

// ---- 문서 자료 렌더 ----
function renderDocs(docFiles) {
  const files = docFiles.filter(f => f.name.toLowerCase() !== "placeholder.txt");

  if (files.length === 0) {
    docsListEl.innerHTML = `<li class="doc-item" style="color:var(--ink-soft);">등록된 문서가 없습니다.</li>`;
    return;
  }

  docsListEl.innerHTML = files.map(f => `
    <li class="doc-item">
      <span>${f.name}</span>
      <a class="dl-btn" href="${f.download_url}" download>다운로드</a>
    </li>
  `).join("");
}

loadTracks();
</script>
</body>
</html>
